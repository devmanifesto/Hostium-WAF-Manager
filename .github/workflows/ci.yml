name: ci

on:
  push:
  pull_request:

jobs:
  unidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Pruebas unitarias
        run: python -m pytest -m "not integration"
      - name: Construir y verificar el paquete
        run: |
          python -m hostium_waf package build --version 1.1.1 --engine 2.9.15
          python -m hostium_waf package verify --zip dist/hostium-1.1.1.zip --metadata dist/meta_hostium.yaml

  integracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Pruebas con Apache y ModSecurity
        id: integracion
        run: python -m pytest -m integration --override-ini="addopts=" -rs
      - name: Avisar si la integracion no llego a ejecutarse
        if: always()
        run: |
          if [ -f reports/integracion-estado.txt ] && grep -q omitida reports/integracion-estado.txt; then
            echo "::notice::La integracion se omitio. Eso no es evidencia de proteccion."
            echo "### Integracion omitida" >> "$GITHUB_STEP_SUMMARY"
            echo "No se construyo o no se descargo la imagen. La suite unitaria no cubre el bloqueo HTTP." >> "$GITHUB_STEP_SUMMARY"
          fi
