name: ci

on:
  push:
  pull_request:
  workflow_call:

jobs:
  unidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Pruebas unitarias
        run: python -m pytest -m "not integration"
      - name: Construir y verificar el paquete
        run: |
          version=$(python -c 'from hostium_waf.crs_vendor import VERSION_RULESET; print(VERSION_RULESET)')
          python -m hostium_waf package build --version "$version" --engine 2.9.15
          python -m hostium_waf package verify --zip "dist/hostium-$version.zip" --metadata dist/meta_hostium.yaml

  integracion:
    env:
      HOSTIUM_REQUIRE_INTEGRATION: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Pruebas con Apache y ModSecurity
        id: integracion
        run: python -m pytest -m integration --override-ini="addopts=" -rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-integracion
          path: reports/
