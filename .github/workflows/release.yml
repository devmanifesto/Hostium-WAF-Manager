name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Pruebas unitarias
        run: python -m pytest -m "not integration"
      - name: Version del tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Construir artefacto local
        run: |
          python -m hostium_waf package build --version "${{ steps.version.outputs.version }}" --engine 2.9.15
          python -m hostium_waf package verify --zip "dist/hostium-${{ steps.version.outputs.version }}.zip" --metadata dist/meta_hostium.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: hostium-waf-${{ steps.version.outputs.version }}
          path: |
            dist/hostium-${{ steps.version.outputs.version }}.zip
            dist/meta_hostium.yaml
            dist/releases/hostium-${{ steps.version.outputs.version }}.sha256
      - name: No publicar
        run: echo "El artefacto queda en la corrida. No se sube a waf.hostium.com ni se instala en cPanel."
