    falsos_positivos_probables: 'Un id custom que PHP igual aceptaría no existe dentro de ese alfabeto:
      PHP usa exactamente ese conjunto. Un sid_length futuro por encima de 256 sí sería un falso positivo.'
    fase: 1
    variables_inspeccionadas:
    - REQUEST_COOKIES:PHPSESSID
    operador: '@rx'
    transformaciones:
    - t:none
    accion: deny
    severidad: CRITICAL
    etiquetas:
    - hostium-php-upload
    - CVE-2026-109618
    estado: produccion
    modo_por_defecto: deny
    incluir_en_paquete: true
    casos_de_prueba_positivos:
