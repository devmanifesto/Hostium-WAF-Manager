    descripcion: Niega la cookie PHPSESSID si no matchea ^[a-zA-Z0-9,-]{1,256}$. El operador del .conf es
      la negación !@rx. 256 es el máximo de session.sid_length en PHP 8; el borrador cortaba en 128 y habría
      negado ids largos pero válidos. Si la cookie no viene, la regla no corre.
