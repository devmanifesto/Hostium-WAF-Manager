      - t:urlDecodeUni
      - t:urlDecodeUni
      - t:htmlEntityDecode
      - t:lowercase
      - t:normalizePath
      - t:removeNulls
    accion: deny
    severidad: CRITICAL
    etiquetas:
      - hostium-sensitive-files
      - attack-disclosure
    estado: produccion
    modo_por_defecto: deny
    incluir_en_paquete: true
    casos_de_prueba_positivos:
      - titulo: git config
        path: /.git/config
        metodo: GET
        dispara: true
        status: 403
        ejecucion: automatizada
      - titulo: git config bak
        path: /.git/config.bak
        metodo: GET
        dispara: true
        status: 403
        ejecucion: automatizada
      - titulo: git config anidado
        path: /app/.git/config
        metodo: GET
        dispara: true
        status: 403
        ejecucion: automatizada
    casos_de_prueba_negativos:
      - titulo: git sin punto
        path: /git/config
        metodo: GET
        dispara: false
        ejecucion: automatizada
      - titulo: gitignore
        path: /.gitignore
        metodo: GET
        dispara: false
        ejecucion: automatizada
      - titulo: nota de blog
        path: /blog/post
        metodo: GET
        dispara: false
        ejecucion: automatizada
