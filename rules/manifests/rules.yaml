  - id: 5500600
    nombre: Cuerpo crudo en multipart
    descripcion: En fase 1, si el Content-Type es multipart/form-data, activa REQUEST_BODY con ctl:forceRequestBodyVariable.
      Sin eso el parser de ModSecurity no llena el cuerpo crudo y las reglas de fase 2 no ven el multipart.
    categoria: php-upload-progress
    modulo: REQUEST-410-PHP-UPLOAD-PROGRESS
    archivo: rules/hostium/REQUEST-410-PHP-UPLOAD-PROGRESS.conf
    version_de_introduccion: 1.1.0
    autor: Hostium
    owner: equipo-seguridad-hostium
    motivacion: Las reglas de amplificación y de filename leen REQUEST_BODY. El manual v2.x dice que esa
      variable no se llena sola en multipart.
    tipo_de_ataque: soporte-de-deteccion
    referencias:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
    - https://github.com/owasp-modsecurity/ModSecurity/wiki/Reference-Manual-(v2.x)
    falsos_positivos_probables: Cualquier POST multipart legítimo ejecuta el ctl. No niega. Duplica el cuerpo
      en memoria hasta SecRequestBodyLimit.
    fase: 1
    variables_inspeccionadas:
    - REQUEST_HEADERS:Content-Type
    operador: '@rx'
    transformaciones:
    - t:none
    accion: pass
    severidad: NOTICE
    etiquetas:
    - hostium-php-upload
    estado: produccion
    modo_por_defecto: log-only
    incluir_en_paquete: true
    casos_de_prueba_positivos:
    - titulo: multipart
      path: /index.php
      metodo: POST
      dispara: true
      ejecucion: automatizada
      notas: 200 quiere decir que la regla no niega. No es el código final de la aplicación. La aproximación
        vive en tests/unit/test_php_upload_progress.py y no es el motor ModSecurity.
      status: 200
      headers:
        Content-Type: multipart/form-data; boundary=abc
    casos_de_prueba_negativos:
    - titulo: json
      path: /index.php
      metodo: POST
      dispara: false
      ejecucion: automatizada
      notas: application/json no pide el cuerpo crudo de multipart.
      headers:
        Content-Type: application/json
    impacto_previsto: No cambia el status. Aumenta la memoria de ModSecurity en cada multipart, acotada
      por el límite de cuerpo ya configurado. No sube ese límite.
    fecha_de_revision: '2026-10-23'
    ultima_validacion: null
    excepciones: []
    registro_de_cambio:
    - version: 1.1.0
      fecha: '2026-10-23'
      nota: Alta en 1.1.0. Para salir, sacá el módulo de la política y publicá otra release. No reescribas
        hostium-1.0.0.zip ni el ZIP de esta versión.
  - id: 5500601
    nombre: Multipart con transferencia chunked
    descripcion: 'Niega un POST cuyo Content-Type es multipart/form-data y cuyo Transfer-Encoding contiene
      chunked como token. Es una cadena: las dos cabeceras tienen que coincidir. El borrador usaba status
      406; aquí el status es 403, igual que el resto del ruleset.'
    categoria: php-upload-progress
    modulo: REQUEST-410-PHP-UPLOAD-PROGRESS
    archivo: rules/hostium/REQUEST-410-PHP-UPLOAD-PROGRESS.conf
    version_de_introduccion: 1.1.0
    autor: Hostium
    owner: equipo-seguridad-hostium
    motivacion: El aviso GHSA-w8hw-w9fx-j79w describe un multipart sin Content-Length usable que pasa el
      control inicial de post_max_size.
    tipo_de_ataque: virtual-patch
    referencias:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/owasp-modsecurity/ModSecurity/wiki/Reference-Manual-(v2.x)
    falsos_positivos_probables: Un cliente legítimo que sube un multipart con Transfer-Encoding chunked.
      HTTP/2 no usa esa cabecera; el caso típico es HTTP/1.1.
    fase: 1
    variables_inspeccionadas:
    - REQUEST_HEADERS:Content-Type
    - REQUEST_HEADERS:Transfer-Encoding
    operador: '@rx'
    transformaciones:
    - t:none
    accion: deny
    severidad: CRITICAL
    etiquetas:
    - hostium-php-upload
    - CVE-2026-109618
    estado: produccion
    modo_por_defecto: deny
    incluir_en_paquete: true
    casos_de_prueba_positivos:
    - titulo: multipart chunked
      path: /index.php
      metodo: POST
      dispara: true
      ejecucion: automatizada
      notas: 403 es el status de esta regla. La aproximación vive en tests/unit/test_php_upload_progress.py
        y no es el motor ModSecurity.
      status: 403
      headers:
        Content-Type: multipart/form-data; boundary=x
        Transfer-Encoding: gzip, chunked
    casos_de_prueba_negativos:
    - titulo: multipart con longitud
      path: /index.php
      metodo: POST
      dispara: false
      ejecucion: automatizada
      notas: Sin chunked no es este vector.
      headers:
        Content-Type: multipart/form-data; boundary=x
    - titulo: json chunked
      path: /api
      metodo: POST
      dispara: false
      ejecucion: automatizada
      notas: chunked solo no alcanza.
      headers:
        Content-Type: application/json
        Transfer-Encoding: chunked
    impacto_previsto: 'Niega la petición antes de PHP. No es el parche: hay que actualizar a 8.2.35, 8.3.36,
      8.4.27 u 8.5.12. No cubre CVE-2026-115560. ultima_validacion queda vacía hasta un cPanel real.'
    fecha_de_revision: '2026-10-23'
    ultima_validacion: null
    excepciones: []
    registro_de_cambio:
    - version: 1.1.0
      fecha: '2026-10-23'
      nota: Alta en 1.1.0. Para salir, sacá el módulo de la política y publicá otra release. No reescribas
        hostium-1.0.0.zip ni el ZIP de esta versión.
  - id: 5500602
    nombre: Cabeceras de parte amplificadas
    descripcion: Niega un cuerpo con 100 o más cabeceras X- seguidas. El aviso dice que representar esas
      cabeceras en PHP gasta mucha más memoria que el tamaño en el cable.
    categoria: php-upload-progress
    modulo: REQUEST-410-PHP-UPLOAD-PROGRESS
    archivo: rules/hostium/REQUEST-410-PHP-UPLOAD-PROGRESS.conf
    version_de_introduccion: 1.1.0
    autor: Hostium
    owner: equipo-seguridad-hostium
    motivacion: Una parte multipart con cabeceras custom sin tope es una de las vías de OOM descritas en
      GHSA-w8hw-w9fx-j79w.
    tipo_de_ataque: virtual-patch
    referencias:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/owasp-modsecurity/ModSecurity/wiki/Reference-Manual-(v2.x)
    falsos_positivos_probables: Un formulario que de verdad envíe 100 cabeceras X- en una parte. No es un
      patrón de navegador.
    fase: 2
    variables_inspeccionadas:
    - REQUEST_BODY
    operador: '@rx'
    transformaciones:
    - t:none
    accion: deny
    severidad: CRITICAL
    etiquetas:
    - hostium-php-upload
    - CVE-2026-109618
    estado: produccion
    modo_por_defecto: deny
