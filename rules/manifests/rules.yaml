      path: /
      metodo: GET
      dispara: true
      ejecucion: automatizada
      notas: 403 es el status de esta regla. La aproximación vive en tests/unit/test_php_upload_progress.py
        y no es el motor ModSecurity.
      status: 403
      headers:
        Cookie: PHPSESSID=_
    casos_de_prueba_negativos:
