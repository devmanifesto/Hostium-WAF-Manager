# Reglas complementarias de seguridad administradas por Hostium 2.1.0
# Exclusiones de objetivo. Fase 1, pass, nolog.
# El campo propio de la aplicación no lleva URI: el ctl nombra ese campo.
# El campo genérico lleva una sola regla de REQUEST_URI, sin cadena.
# El ctl queda en la transacción y alcanza una regla CRS de fase 2.
# No quita la regla. No abre la petición. No exceptúa login ni un admin.
# 5500900 ARGS:firmadatos es un JPEG en data-URI. 941130 matchea punto y coma base64 y 941170 matchea el data-URI con base64. El resto de los ARGS sigue inspeccionado y las demás reglas 941 siguen viendo firmadatos. Owner equipo-seguridad-hostium. Revisión 2027-05-02. Ticket 2026-11-02-siga-xqempresas-aceptar.
SecAction \
    "id:5500900,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.0',\
ctl:ruleRemoveTargetById=941130;ARGS:firmadatos,\
ctl:ruleRemoveTargetById=941170;ARGS:firmadatos"

# 5500901 ARGS:vseleccionados es una lista de cuentas unida con dos barras verticales. 942100 es detectSQLi. Las demás reglas 942 siguen viendo ese campo. Owner equipo-seguridad-hostium. Revisión 2027-05-02.
SecAction \
    "id:5500901,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.0',\
ctl:ruleRemoveTargetById=942100;ARGS:vseleccionados"

# 5500902 ARGS:emailglobalheader y ARGS:emailglobalfooter son el HTML de la plantilla de mail de WHMCS. El caso sumó 55 entre reglas 941 y 932 sobre esos dos campos. El resto de los argumentos sigue inspeccionado. Owner equipo-seguridad-hostium. Revisión 2027-05-02. Ticket 2026-11-02-whmcs-configgeneral-save.
SecAction \
    "id:5500902,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.0',\
ctl:ruleRemoveTargetByTag=attack-xss;ARGS:emailglobalheader,\
ctl:ruleRemoveTargetByTag=attack-rce;ARGS:emailglobalheader,\
ctl:ruleRemoveTargetByTag=attack-xss;ARGS:emailglobalfooter,\
ctl:ruleRemoveTargetByTag=attack-rce;ARGS:emailglobalfooter"

# 5500903 El HTML de la ficha de PrestaShop viaja en ARGS. La URI contiene /sell/catalog/, con cualquier producto y cualquier token. 941160 deja de mirar ARGS solo ahí. Las otras reglas 941 de ese POST siguen. Owner equipo-seguridad-hostium. Revisión 2027-05-02.
SecRule REQUEST_URI "@contains /sell/catalog/" \
    "id:5500903,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.0',\
ctl:ruleRemoveTargetById=941160;ARGS"

# 5500904 ARGS:datos es un stdClass serializado de PHP. 933170 matchea la letra O, dos puntos y dígitos. No se saca ARGS:datos en el resto de los sitios. Owner equipo-seguridad-hostium. Revisión 2027-05-02.
SecRule REQUEST_URI "@beginsWith /aplicacion_customs/marketingdirecto/recibepostturnero.php" \
    "id:5500904,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.0',\
ctl:ruleRemoveTargetById=933170;ARGS:datos"
