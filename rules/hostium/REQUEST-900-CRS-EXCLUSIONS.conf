# 5500902: Plantilla HTML de WHMCS; caso confirmado por el operador con score 5 aportado por 921130. Owner equipo-seguridad-hostium. Revisión 2027-05-02. Ticket 2026-11-02-whmcs-configgeneral-save.
SecRule REQUEST_HEADERS:Host "@rx (?i)\A(?:clientes\.hostium\.com)(?::[0-9]{1,5})?\z" \
    "id:5500902,phase:1,pass,nolog,t:none,tag:'hostium-crs-exclusion',ver:'hostium/2.1.4',chain"
    SecRule REQUEST_FILENAME "@streq /admin1911/configgeneral.php" "t:none,chain"
        SecRule REQUEST_METHOD "@rx \A(?:POST)\z" "t:none,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:emailglobalheader,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:emailglobalheader,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:emailglobalfooter,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:emailglobalfooter,ctl:ruleRemoveTargetById=921130;ARGS:emailglobalheader,ctl:ruleRemoveTargetById=921130;ARGS:emailglobalfooter"

