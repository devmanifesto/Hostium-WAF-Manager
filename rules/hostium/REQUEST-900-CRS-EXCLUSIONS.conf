# Reglas complementarias de seguridad administradas por Hostium 2.1.0
# Exclusiones de objetivo para falsos positivos concretos.
# Fase 1: el ctl queda en la transacción y alcanza una regla CRS de fase 2
# aunque WHM incluya este vendor después de OWASP3.
# El ctl está en el segundo eslabón. En ModSecurity 2 un ctl del starter
# corre aunque la cadena no cierre.
# No quita la regla. No abre la petición. Si la URI no se pide, no matchea.
# 5500900 ARGS:firmadatos es un JPEG en data-URI, data:image/jpeg;base64,/9j/. 941130 matchea ;base64 y 941170 matchea data: con base64. Owner equipo-seguridad-hostium. Revisión 2027-05-02. Ticket 2026-11-02-siga-xqempresas-aceptar.
SecRule REQUEST_URI "@beginsWith /aplicacion_customs/xqempresas/aceptar.php" \
    "id:5500900,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.0',\
chain"
    SecRule REQUEST_URI "@beginsWith /aplicacion_customs/xqempresas/aceptar.php" \
        "t:none,\
ctl:ruleRemoveTargetById=941130;ARGS:firmadatos,\
ctl:ruleRemoveTargetById=941170;ARGS:firmadatos"

# 5500901 El backoffice de PrestaShop manda HTML de producto en ARGS. En paranoia 1 una sola de estas XSS suma 5 y dispara 949110. El resto del sitio conserva esas reglas. Owner equipo-seguridad-hostium. Revisión 2027-05-02.
SecRule REQUEST_URI "@rx ^/admin[A-Za-z0-9]+/(?:index\.php/)?sell/catalog/products(?:/|\?|$)" \
    "id:5500901,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.0',\
chain"
    SecRule REQUEST_URI "@rx ^/admin[A-Za-z0-9]+/(?:index\.php/)?sell/catalog/products(?:/|\?|$)" \
        "t:none,\
ctl:ruleRemoveTargetById=941100;ARGS,\
ctl:ruleRemoveTargetById=941110;ARGS,\
ctl:ruleRemoveTargetById=941120;ARGS,\
ctl:ruleRemoveTargetById=941130;ARGS,\
ctl:ruleRemoveTargetById=941140;ARGS,\
ctl:ruleRemoveTargetById=941160;ARGS,\
ctl:ruleRemoveTargetById=941170;ARGS,\
ctl:ruleRemoveTargetById=941180;ARGS"

