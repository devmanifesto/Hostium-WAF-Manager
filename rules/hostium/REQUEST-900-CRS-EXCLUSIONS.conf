# Reglas complementarias de seguridad administradas por Hostium 2.1.4
# Runtime fase 1. Dominio exacto, ruta sin query y método; ctl al final de la cadena.
# Una regla de path no lleva dominio: REQUEST_FILENAME, GET y ctl solo en el método.
# Una entrada deshabilitada conserva su id con una condición que nunca coincide.
# Compatibilidad transitoria de cuatro casos 2.1.1; WHMCS tiene alcance explícito.
# 5500900: Compatibilidad transitoria con 2.1.1 para evitar restaurar falsos positivos existentes. Owner equipo-seguridad-hostium. Revisión 2027-05-02. Ticket 2026-11-02-siga-xqempresas-aceptar.
# HEREDADA 2.1.1: pendiente de delimitar; no se amplía su alcance.
SecAction \
    "id:5500900,\
phase:1,\
pass,\
nolog,\
t:none,\
tag:'hostium-crs-exclusion',\
ver:'hostium/2.1.4',\
ctl:ruleRemoveTargetById=941130;ARGS:firmadatos,\
ctl:ruleRemoveTargetById=941170;ARGS:firmadatos"

