# Reglas complementarias de seguridad administradas por Hostium 1.2.0
# Virtual patch parcial de PHP2Shell (CVE-2026-109618 y CVE-2026-109619).
# No sustituye actualizar PHP a 8.2.35, 8.3.36, 8.4.27 u 8.5.12.
# Tampoco cubre CVE-2026-115560. El arreglo completo es el parche de PHP,
# con session.upload_progress.enabled=0 mientras tanto, aplicado en php.ini
# o en el pool, y reinicio de los workers.
# Cada id es una regla, salvo 5500601: las dos cabeceras se combinan con chain
# porque una sola SecRule no puede exigir las dos a la vez.
# El borrador usaba ids 1006101-1006126, fuera del rango 5500000-5509999.
# La acción disruptiva es deny,status:403. No se usa block ni 406.
# En ModSecurity 2, REQUEST_BODY queda vacío si el procesador ya es MULTIPART.
# El manual v2 limita ctl:forceRequestBodyVariable al caso sin procesador.
# Esta versión lee ARGS, FILES y MULTIPART_PART_HEADERS.
# No se enciende SecResponseBodyAccess. En cPanel el vendor aplica a todo el servidor
# y bufferizar cada respuesta no entra en el ZIP. Las reglas de fase 4 viven en
# REQUEST-411-PHP-UPLOAD-PROGRESS-RESPONSE.conf.example y no se empaquetan.
# Supuesto: este archivo se incluye en la config de Apache. Un include posterior
# que vuelva a apagar el cuerpo deja ciegas las reglas de fase 2.

SecRequestBodyAccess On

# El ctl no llena REQUEST_BODY en un multipart: el procesador ya está elegido.
# La regla no niega. Se conserva para el caso del manual, un cuerpo sin procesador.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data\s*(?:;|$)" \
    "id:5500600,\
phase:1,\
pass,\
nolog,\
t:none,\
ctl:forceRequestBodyVariable=On,\
tag:'hostium-php-upload',\
ver:'hostium/1.1.0'"

# Vector A: POST multipart con Transfer-Encoding chunked. PHP puede no aplicar
# post_max_size si no hay Content-Length usable.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data\s*(?:;|$)" \
    "id:5500601,\
phase:1,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: multipart con Transfer-Encoding chunked (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0',\
chain"
    SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)(?:^|[,\t ])chunked(?:$|[,\t ])" \
        "t:none"

# Vector B: 100 o más cabeceras X- de parte. Cada una es un miembro de
# MULTIPART_PART_HEADERS. 5500606 cuenta. Un valor largo o un LF no se escapan:
# el parser ya separó la cabecera. Tiene que estar antes de 5500602.
SecRule MULTIPART_PART_HEADERS "@rx (?i)^X-[A-Za-z0-9-]{1,32}[ \t]*:" \
    "id:5500606,\
phase:2,\
pass,\
nolog,\
t:none,\
setvar:tx.hostium_xhdr=+1,\
tag:'hostium-php-upload',\
ver:'hostium/1.2.0'"

SecRule TX:hostium_xhdr "@ge 100" \
    "id:5500602,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: amplificación de cabeceras de parte multipart (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Nombres con 40 o más grupos de corchetes. ARGS_NAMES no trae el signo igual:
# la segunda alternativa cubre el nombre ya parseado. max_input_nesting_level
# de PHP admite 64 por defecto; 40 es más estricto y puede tocar formularios raros.
SecRule ARGS_NAMES|REQUEST_BODY "@rx (?:name=\"[^\"]{0,256}(?:\[[^\]]{0,256}\]){40,}|[A-Za-z_][A-Za-z0-9_]{0,256}(?:\[[^\]]{0,256}\]){40,}(?:=|$))" \
    "id:5500603,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: nombres de entrada con anidación profunda (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Filename vacío. En este motor FILES guarda el nombre del archivo y queda vacío.
# 5500607 cuenta. Una sola parte vacía no niega. Tiene que estar antes de 5500604.
SecRule FILES "@rx ^$" \
    "id:5500607,\
phase:2,\
pass,\
nolog,\
t:none,\
setvar:tx.hostium_emptyfile=+1,\
tag:'hostium-php-upload',\
ver:'hostium/1.2.0'"

SecRule TX:hostium_emptyfile "@ge 50" \
    "id:5500604,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: inundación de partes con filename vacío (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# El parser cuenta partes de archivo. Un filename vacío puede no entrar en esta colección.
SecRule &FILES "@ge 300" \
    "id:5500605,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: cantidad anómala de partes de archivo (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# El valor de PHP_SESSION_UPLOAD_PROGRESS puede volverse clave de sesión.
# Las letras de tipo van en mayúscula o minúscula: O: es un objeto serializado.
SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx (<\?=|<\?php|O:[0-9]{1,5}:\"|s:[0-9]{1,6}:\"|C:[0-9]{1,6}:\"|a:[0-9]{1,6}:\{|[A-Za-z]:[0-9]{1,6}:\{|\|[A-Za-z]:[0-9])" \
    "id:5500611,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: carga serializada en PHP_SESSION_UPLOAD_PROGRESS (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# La misma carga, en el nombre de archivo. FILES es el filename. FILES_NAMES es
# el campo. REQUEST_BODY no se usa: en multipart viene vacío y en urlencoded
# un <?php de un formulario no es un filename.
SecRule FILES|FILES_NAMES "@rx (?:<\?=|<\?php|O:[0-9]{1,5}:\"|s:[0-9]{1,6}:\"|C:[0-9]{1,6}:\")" \
    "id:5500612,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: carga en el filename multipart (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Un id de sesión no tiene que llegar como campo de formulario.
# Supuesto no verificado en este repo: hay informes de que el arreglo 8.2.35
# sigue aceptando el sid por formulario si cleanup=0. Esta regla se mantiene igual.
SecRule ARGS_NAMES "@rx ^PHPSESSID(?:\[[^\]]{0,64}\]){0,8}$" \
    "id:5500613,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: PHPSESSID enviado como campo de formulario (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Defensa amplia. No niega. ARGS cubre el campo ya parseado. REQUEST_BODY cubre
# el urlencoded, donde esa variable sí existe. El contenido de un archivo no
# entra en ninguna de las dos.
SecRule ARGS|REQUEST_BODY "@rx (?i)<\?php" \
    "id:5500614,\
phase:2,\
pass,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: etiqueta de apertura PHP en el cuerpo',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'WARNING',\
ver:'hostium/1.1.0'"

# Más de 500 partes. Cada Content-Disposition parseada suma. 5500608 cuenta
# y tiene que estar antes de esta regla. Un espacio antes del punto y coma
# no se escapa: el parser igual deja la cabecera.
SecRule MULTIPART_PART_HEADERS "@rx (?i)^Content-Disposition:[ \t]{0,5}form-data[ \t]{0,5};" \
    "id:5500608,\
phase:2,\
pass,\
nolog,\
t:none,\
setvar:tx.hostium_parts=+1,\
tag:'hostium-php-upload',\
ver:'hostium/1.2.0'"

SecRule TX:hostium_parts "@ge 500" \
    "id:5500615,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: inundación de partes multipart (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx ^\|[A-Za-z]:" \
    "id:5500616,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: semilla de serialización con pipe en upload-progress (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Oráculo de fuga: un PHPSESSID de 257 o más. session.sid_length admite hasta 256.
# 200 a 256 es un id válido y no niega.
SecRule RESPONSE_HEADERS:Set-Cookie "@rx PHPSESSID=[^;\s]{257,}" \
    "id:5500617,\
phase:3,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: Set-Cookie PHPSESSID demasiado largo (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# filename de 65535 caracteres o más. FILES es el nombre. El prefijo filename="
# cubre un REQUEST_BODY si algún motor lo llenara.
SecRule FILES|REQUEST_BODY "@rx (?:^|filename=\")[^\r\n\"]{65535}" \
    "id:5500618,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: filename multipart gigante (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Presencia del campo, sin carga. Aviso: las barras de progreso legítimas también coinciden.
SecRule ARGS_NAMES|REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
    "id:5500619,\
phase:2,\
pass,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: campo PHP_SESSION_UPLOAD_PROGRESS presente',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'NOTICE',\
ver:'hostium/1.1.0'"

# PHP acepta [a-zA-Z0-9,-] y session.sid_length hasta 256. El borrador cortaba en 128.
SecRule REQUEST_COOKIES:PHPSESSID "!@rx ^[a-zA-Z0-9,-]{1,256}$" \
    "id:5500621,\
phase:1,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: cookie PHPSESSID fuera del alfabeto de PHP (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

SecRule ARGS "@rx ^(?:/(?:tmp|var/lib/php|var/www)/(?:sessions?/|sess/)?|/tmp/)sess_[a-zA-Z0-9,-]{6,}$" \
    "id:5500622,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: ruta de archivo de sesión en argumentos (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

SecRule REQUEST_URI|ARGS "@contains p2s_8512_shell.php" \
    "id:5500625,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
t:lowercase,\
msg:'Hostium WAF: acceso a webshell p2s_8512_shell.php (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"
