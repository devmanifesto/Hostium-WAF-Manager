# Virtual patch parcial de PHP2Shell (CVE-2026-109618 y CVE-2026-109619).
# No sustituye actualizar PHP a 8.2.35, 8.3.36, 8.4.27 u 8.5.12.
# Tampoco cubre CVE-2026-115560. El arreglo completo es el parche de PHP,
# con session.upload_progress.enabled=0 mientras tanto, aplicado en php.ini
# o en el pool, y reinicio de los workers.
# Cada id es una regla, salvo 5500601: las dos cabeceras se combinan con chain
# porque una sola SecRule no puede exigir las dos a la vez.
# El borrador usaba ids 1006101-1006126, fuera del rango 5500000-5509999.
# La acción disruptiva es deny,status:403. No se usa block ni 406.
# No se sube SecRequestBodyLimit: el cuerpo crudo se conserva solo hasta ese tope.
# Supuesto: este archivo se incluye en la config de Apache. Un include posterior
# que vuelva a apagar el cuerpo deja ciegas las reglas de fase 2 y 4.

SecRequestBodyAccess On
SecResponseBodyAccess On

# Hace visible REQUEST_BODY en multipart. Sin esto el parser no llena esa variable
# y las reglas de cuerpo crudo no ven el ataque. Duplica el cuerpo en memoria,
# acotado por SecRequestBodyLimit.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data\s*(?:;|$)" \
    "id:5500600,\
phase:1,\
pass,\
nolog,\
t:none,\
ctl:forceRequestBodyVariable=On,\
tag:'hostium-php-upload',\
ver:'hostium/1.1.0'"

# Vector A: POST multipart con Transfer-Encoding chunked. PHP puede no aplicar
# post_max_size si no hay Content-Length usable.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data\s*(?:;|$)" \
    "id:5500601,\
phase:1,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: multipart con Transfer-Encoding chunked (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0',\
chain"
    SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)(?:^|[,\t ])chunked(?:$|[,\t ])" \
        "t:none"

# Vector B: 100 o más cabeceras X- seguidas dentro de una parte.
SecRule REQUEST_BODY "@rx (?i)(\r\nX-[a-z0-9-]{1,32}:[^\r\n]{0,256}){100,}" \
    "id:5500602,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: amplificación de cabeceras de parte multipart (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Nombres con 40 o más grupos de corchetes. ARGS_NAMES no trae el signo igual:
# la segunda alternativa cubre el nombre ya parseado. max_input_nesting_level
# de PHP admite 64 por defecto; 40 es más estricto y puede tocar formularios raros.
SecRule ARGS_NAMES|REQUEST_BODY "@rx (?:name=\"[^\"]{0,64}(?:\[[^\]]{0,32}\]){40,}|[A-Za-z_][A-Za-z0-9_]{0,32}(?:\[[^\]]{0,32}\]){40,}(?:=|$))" \
    "id:5500603,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: nombres de entrada con anidación profunda (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Inundación de partes con filename vacío. No se cuentan bien en max_file_uploads.
SecRule REQUEST_BODY "@rx (filename=\"\"\r\nContent-Type[^\r\n]{0,80}\r\n\r\n(?:\r\n)?--[^\r\n]{0,80}\r\nContent-Disposition[^\r\n]{0,160}; ){50,}" \
    "id:5500604,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: inundación de partes con filename vacío (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# El parser cuenta partes de archivo. Un filename vacío puede no entrar en esta colección.
SecRule &FILES "@ge 300" \
    "id:5500605,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: cantidad anómala de partes de archivo (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# El valor de PHP_SESSION_UPLOAD_PROGRESS puede volverse clave de sesión.
# Las letras de tipo van en mayúscula o minúscula: O: es un objeto serializado.
SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx (<\?=|<\?php|O:[0-9]{1,5}:\"|a:[0-9]{1,6}:\{|[A-Za-z]:[0-9]{1,6}:\{|\|[A-Za-z]:[0-9])" \
    "id:5500611,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: carga serializada en PHP_SESSION_UPLOAD_PROGRESS (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# La misma carga, metida en el filename de una parte.
SecRule FILES_NAMES|REQUEST_BODY "@rx (filename=\"[^\"]{0,512}?(<\?=|<\?php|O:[0-9]{1,5}:\"))" \
    "id:5500612,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: carga en el filename multipart (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Un id de sesión no tiene que llegar como campo de formulario.
# Supuesto no verificado en este repo: hay informes de que el arreglo 8.2.35
# sigue aceptando el sid por formulario si cleanup=0. Esta regla se mantiene igual.
SecRule ARGS_NAMES "@streq PHPSESSID" \
    "id:5500613,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: PHPSESSID enviado como campo de formulario (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Defensa amplia. No niega: en hosting un <?php en el cuerpo es un archivo o un
# texto legítimo. La severidad queda en aviso para afinar por sitio.
SecRule REQUEST_BODY "@rx (?i)<\?php" \
    "id:5500614,\
phase:2,\
pass,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: etiqueta de apertura PHP en el cuerpo',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'WARNING',\
ver:'hostium/1.1.0'"

# Más de 500 partes. El borrador hablaba de grooming del heap de ZendMM.
SecRule REQUEST_BODY "@rx (?i)(Content-Disposition: form-data;[^\r\n]{0,200}\r\n){500,}" \
    "id:5500615,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: inundación de partes multipart (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

SecRule ARGS:PHP_SESSION_UPLOAD_PROGRESS "@rx ^\|[A-Za-z]:" \
    "id:5500616,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: semilla de serialización con pipe en upload-progress (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Oráculo de fuga: el Set-Cookie de sesión sale con un valor enorme.
SecRule RESPONSE_HEADERS:Set-Cookie "@rx PHPSESSID=[^;\s]{200,}" \
    "id:5500617,\
phase:3,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: Set-Cookie PHPSESSID demasiado largo (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# filename de 65535 caracteres o más. PCRE1, el de ModSecurity 2.9, no compila {65536}.
SecRule FILES_NAMES|REQUEST_BODY "@rx filename=\"[^\r\n]{65535,}" \
    "id:5500618,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: filename multipart gigante (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# Presencia del campo, sin carga. Aviso: las barras de progreso legítimas también coinciden.
SecRule ARGS_NAMES|REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
    "id:5500619,\
phase:2,\
pass,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: campo PHP_SESSION_UPLOAD_PROGRESS presente',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'NOTICE',\
ver:'hostium/1.1.0'"

# Tres avisos de sesión en la respuesta, en ese orden. RESPONSE_BODY es fase 4,
# no fase 3. Hace falta SecResponseBodyAccess y un mime que ModSecurity inspeccione.
SecRule RESPONSE_BODY "@rx (?s)(Session ID is too long or contains illegal characters.*Failed to read session data.*Failed to write session data)" \
    "id:5500620,\
phase:4,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: respuesta con fallos de sesión encadenados (CVE-2026-109618 CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# PHP acepta [a-zA-Z0-9,-] y session.sid_length hasta 256. El borrador cortaba en 128.
SecRule REQUEST_COOKIES:PHPSESSID "!@rx ^[a-zA-Z0-9,-]{1,256}$" \
    "id:5500621,\
phase:1,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: cookie PHPSESSID fuera del alfabeto de PHP (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

SecRule ARGS "@rx (?:/(?:tmp|var/lib/php|var/www)/(?:sessions?/|sess/)?|/tmp/)sess_[a-zA-Z0-9,-]{6,}" \
    "id:5500622,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: ruta de archivo de sesión en argumentos (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

# No niega: la página de error ya salió. Sirve para el registro.
SecRule RESPONSE_BODY "@rx Allowed memory size.{1,50}exhausted" \
    "id:5500623,\
phase:4,\
pass,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: memoria agotada en la respuesta (CVE-2026-109618)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109618',\
severity:'WARNING',\
ver:'hostium/1.1.0'"

SecRule RESPONSE_BODY "@rx (Session object destruction failed|Failed to decode session object)" \
    "id:5500624,\
phase:4,\
pass,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: fallo al decodificar la sesión en la respuesta (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'WARNING',\
ver:'hostium/1.1.0'"

SecRule REQUEST_URI|ARGS "@contains p2s_8512_shell.php" \
    "id:5500625,\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: acceso a webshell p2s_8512_shell.php (CVE-2026-109619)',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"

SecRule RESPONSE_BODY "@rx (SHELL_ALIVE|PAYLOAD_PERSISTED)" \
    "id:5500626,\
phase:4,\
pass,\
log,\
auditlog,\
t:none,\
msg:'Hostium WAF: marcador de post-explotación en la respuesta',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-php-upload',\
tag:'CVE-2026-109619',\
severity:'CRITICAL',\
ver:'hostium/1.1.0'"
