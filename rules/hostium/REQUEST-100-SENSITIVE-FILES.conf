# Archivos secretos de alto consenso.
# Complementa OWASP CRS sin editar sus archivos y sin afirmar que CRS no cubriera este caso.
# Cada ID es una regla independiente: no hay chain, así el log identifica el control.
# No se inspeccionan argumentos. Un query string que menciona .env no es este control.
# Transformaciones, en orden: doble decodificación de URL, entidades HTML, minúsculas,
# normalización de ruta y eliminación de bytes nulos. t:none anula la lista por defecto.

SecRule REQUEST_FILENAME|REQUEST_BASENAME "@rx (?:^|/)\.env(?:$|[./?])" \
    "id:5500100,\
phase:1,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
t:urlDecodeUni,\
t:urlDecodeUni,\
t:htmlEntityDecode,\
t:lowercase,\
t:normalizePath,\
t:removeNulls,\
msg:'Hostium WAF: solicitud de archivo secreto .env',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-sensitive-files',\
tag:'attack-disclosure',\
severity:'CRITICAL',\
ver:'hostium/1.0.0'"

SecRule REQUEST_FILENAME|REQUEST_BASENAME "@rx (?:^|/)\.git/config(?:$|[./?])" \
    "id:5500101,\
phase:1,\
deny,\
status:403,\
log,\
auditlog,\
t:none,\
t:urlDecodeUni,\
t:urlDecodeUni,\
t:htmlEntityDecode,\
t:lowercase,\
t:normalizePath,\
t:removeNulls,\
msg:'Hostium WAF: solicitud de archivo secreto .git/config',\
logdata:'%{MATCHED_VAR_NAME}',\
tag:'hostium-sensitive-files',\
tag:'attack-disclosure',\
severity:'CRITICAL',\
ver:'hostium/1.0.0'"
