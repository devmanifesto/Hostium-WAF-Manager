version_esquema: 1
# Catálogo que genera rules/hostium/REQUEST-900-CRS-EXCLUSIONS.conf.
# Sin uri: el campo es propio de la aplicación y el ctl corre en cada petición.
# Con uri: el campo es genérico y el ctl corre solo en esa ruta.
# No hay /login, ni un directorio admin, ni configgeneral.php.
exclusiones:
  - id: '5500900'
    tipo: runtime
    regla_objetivo: '941130,941170'
    motivo: >-
      ARGS:firmadatos es un JPEG en data-URI. 941130 matchea punto y coma base64
      y 941170 matchea el data-URI con base64. El resto de los ARGS sigue
      inspeccionado y las demás reglas 941 siguen viendo firmadatos.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: campo ARGS:firmadatos en 941130 y 941170
    ticket: 2026-11-02-siga-xqempresas-aceptar
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '941130'
        variable: ARGS:firmadatos
      - tipo: ruleRemoveTargetById
        objetivo: '941170'
        variable: ARGS:firmadatos
  - id: '5500901'
    tipo: runtime
    regla_objetivo: '942100'
    motivo: >-
      ARGS:vseleccionados es una lista de cuentas unida con dos barras
      verticales. 942100 es detectSQLi. Las demás reglas 942 siguen viendo
      ese campo.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: campo ARGS:vseleccionados en 942100
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '942100'
        variable: ARGS:vseleccionados
  - id: '5500902'
    tipo: runtime
    regla_objetivo: attack-xss,attack-rce
    motivo: >-
      ARGS:emailglobalheader y ARGS:emailglobalfooter son el HTML de la
      plantilla de mail de WHMCS. El caso sumó 55 entre reglas 941 y 932
      sobre esos dos campos. El resto de los argumentos sigue inspeccionado.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: campos ARGS:emailglobalheader y ARGS:emailglobalfooter en attack-xss y attack-rce
    ticket: 2026-11-02-whmcs-configgeneral-save
    controles:
      - tipo: ruleRemoveTargetByTag
        objetivo: attack-xss
        variable: ARGS:emailglobalheader
      - tipo: ruleRemoveTargetByTag
        objetivo: attack-rce
        variable: ARGS:emailglobalheader
      - tipo: ruleRemoveTargetByTag
        objetivo: attack-xss
        variable: ARGS:emailglobalfooter
      - tipo: ruleRemoveTargetByTag
        objetivo: attack-rce
        variable: ARGS:emailglobalfooter
  - id: '5500903'
    tipo: runtime
    regla_objetivo: '941160'
    motivo: >-
      El HTML de la ficha de PrestaShop viaja en ARGS. La URI contiene
      /sell/catalog/, con cualquier producto y cualquier token. 941160 deja
      de mirar ARGS solo ahí. Las otras reglas 941 de ese POST siguen.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: URI que contiene /sell/catalog/ coleccion ARGS en 941160
    uri:
      operador: '@contains'
      valor: /sell/catalog/
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '941160'
        variable: ARGS
  - id: '5500904'
    tipo: runtime
    regla_objetivo: '933170'
    motivo: >-
      ARGS:datos es un stdClass serializado de PHP. 933170 matchea la letra O,
      dos puntos y dígitos. No se saca ARGS:datos en el resto de los sitios.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: URI /aplicacion_customs/marketingdirecto/recibepostturnero.php campo ARGS:datos
    uri:
      operador: '@beginsWith'
      valor: /aplicacion_customs/marketingdirecto/recibepostturnero.php
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '933170'
        variable: ARGS:datos
