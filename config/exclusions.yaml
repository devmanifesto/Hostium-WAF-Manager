version_esquema: 1
# Catálogo que genera rules/hostium/REQUEST-900-CRS-EXCLUSIONS.conf.
# Cada ítem es fase 1, pass, nolog, atado a una URI. No hay /login ni IP.
exclusiones:
  - id: '5500900'
    tipo: runtime
    regla_objetivo: '941130,941170'
    motivo: >-
      ARGS:firmadatos es un JPEG en data-URI, data:image/jpeg;base64,/9j/.
      941130 matchea ;base64 y 941170 matchea data: con base64.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: URI /aplicacion_customs/xqempresas/aceptar.php campo ARGS:firmadatos
    ticket: 2026-11-02-siga-xqempresas-aceptar
    uri:
      operador: '@beginsWith'
      valor: /aplicacion_customs/xqempresas/aceptar.php
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '941130'
        variable: ARGS:firmadatos
      - tipo: ruleRemoveTargetById
        objetivo: '941170'
        variable: ARGS:firmadatos
  - id: '5500901'
    tipo: runtime
    regla_objetivo: '941100,941110,941120,941130,941140,941160,941170,941180'
    motivo: >-
      El backoffice de PrestaShop manda HTML de producto en ARGS.
      En paranoia 1 una sola de estas XSS suma 5 y dispara 949110.
      El resto del sitio conserva esas reglas.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: URI /adminTOKEN/sell/catalog/products/ coleccion ARGS
    uri:
      operador: '@rx'
      valor: '^/admin[A-Za-z0-9]+/(?:index\.php/)?sell/catalog/products(?:/|\?|$)'
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '941100'
        variable: ARGS
      - tipo: ruleRemoveTargetById
        objetivo: '941110'
        variable: ARGS
      - tipo: ruleRemoveTargetById
        objetivo: '941120'
        variable: ARGS
      - tipo: ruleRemoveTargetById
        objetivo: '941130'
        variable: ARGS
      - tipo: ruleRemoveTargetById
        objetivo: '941140'
        variable: ARGS
      - tipo: ruleRemoveTargetById
        objetivo: '941160'
        variable: ARGS
      - tipo: ruleRemoveTargetById
        objetivo: '941170'
        variable: ARGS
      - tipo: ruleRemoveTargetById
        objetivo: '941180'
        variable: ARGS
  - id: '5500902'
    tipo: runtime
    regla_objetivo: '942100'
    motivo: >-
      ARGS:vseleccionados es una lista de cuentas unida con ||.
      En paranoia 1 la marca 942100. 942360 pide palabras SQL y 942120 es paranoia 2.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: URI /server20200601/mod/contabilidad/multisel_cuentacont.php campo ARGS:vseleccionados
    uri:
      operador: '@beginsWith'
      valor: /server20200601/mod/contabilidad/multisel_cuentacont.php
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '942100'
        variable: ARGS:vseleccionados
  - id: '5500903'
    tipo: runtime
    regla_objetivo: '933170'
    motivo: >-
      ARGS:datos es un stdClass serializado de PHP. 933170 matchea O:digitos:.
      933100 busca <?php, no el objeto.
    owner: equipo-seguridad-hostium
    fecha_revision: '2027-05-02'
    alcance: URI /aplicacion_customs/marketingdirecto/recibepostturnero.php campo ARGS:datos
    uri:
      operador: '@beginsWith'
      valor: /aplicacion_customs/marketingdirecto/recibepostturnero.php
    controles:
      - tipo: ruleRemoveTargetById
        objetivo: '933170'
        variable: ARGS:datos
